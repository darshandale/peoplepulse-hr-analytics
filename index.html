<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PeoplePulse HR Analytics Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#161a2b; --sub:#5b6178; --border:#e5e8f0;
  --accent:#5b5ff0; --accent2:#00b3a4; --danger:#e0446c; --warn:#f2a541; --good:#2fb673;
  --shadow:0 1px 3px rgba(20,20,40,.06),0 8px 24px rgba(20,20,40,.04);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1220;--card:#171b2e;--ink:#eef0fb;--sub:#9297b3;--border:#2a2f47;
    --shadow:0 1px 3px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1220;--card:#171b2e;--ink:#eef0fb;--sub:#9297b3;--border:#2a2f47;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
header{
  padding:20px 24px 14px;border-bottom:1px solid var(--border);
  position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;
}
header h1{margin:0;font-size:1.4rem;font-weight:800;letter-spacing:-.02em;}
header p{margin:4px 0 0;color:var(--sub);font-size:.88rem;}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px;}
nav button{
  border:1px solid var(--border);background:var(--card);color:var(--sub);
  padding:8px 14px;border-radius:999px;font-size:.82rem;font-weight:600;cursor:pointer;
  transition:.15s;
}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px;}
.tab{display:none;}
.tab.active{display:block;animation:fade .25s ease;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px;}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);}
.kpi .lbl{font-size:.72rem;color:var(--sub);text-transform:uppercase;letter-spacing:.04em;font-weight:700;}
.kpi .val{font-size:1.5rem;font-weight:800;margin-top:4px;}
.kpi .tag{font-size:.72rem;margin-top:3px;font-weight:600;}
.good{color:var(--good);} .warn{color:var(--warn);} .bad{color:var(--danger);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr;}}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow);margin-bottom:16px;}
.card h3{margin:0 0 2px;font-size:.98rem;font-weight:750;}
.card .sub{font-size:.78rem;color:var(--sub);margin-bottom:10px;}
.chartwrap{position:relative;height:230px;}
.insight{
  background:linear-gradient(135deg,rgba(91,95,240,.08),rgba(0,179,164,.06));
  border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:12px;padding:14px 16px;margin-bottom:18px;font-size:.85rem;line-height:1.55;
}
.insight b{color:var(--accent);}
.insight.risk{border-left-color:var(--danger);}
.insight.risk b{color:var(--danger);}
ul.actions{margin:6px 0 0;padding-left:18px;}
ul.actions li{margin-bottom:4px;font-size:.85rem;}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:700;background:var(--danger);color:#fff;margin-left:8px;}
table{width:100%;border-collapse:collapse;font-size:.83rem;}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);}
th{color:var(--sub);font-weight:700;font-size:.72rem;text-transform:uppercase;}
tr:hover td{background:rgba(91,95,240,.05);}
.tblwrap{overflow-x:auto;}
footer{text-align:center;color:var(--sub);font-size:.75rem;padding:20px;}
</style>
</head>

function bar(id, labels, data, label, color, extra={}){
  new Chart(document.getElementById(id), {type:'bar', data:{labels, datasets:[{label, data, backgroundColor:color, borderRadius:6, maxBarThickness:38}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{beginAtZero:true, grid:{color:borderColor()}}, x:{grid:{display:false}}}, ...extra}});
}
function doughnut(id, labels, data){
  new Chart(document.getElementById(id), {type:'doughnut', data:{labels, datasets:[{data, backgroundColor:palette}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:11}}}}}});
}
function line2(id, labels, bars, barLabel, lineData, lineLabel){
  new Chart(document.getElementById(id), {data:{labels, datasets:[
    {type:'bar', label:barLabel, data:bars, backgroundColor:colors.a, borderRadius:6, yAxisID:'y'},
    {type:'line', label:lineLabel, data:lineData, borderColor:colors.c, backgroundColor:colors.c, yAxisID:'y1', tension:.3}
  ]}, options:{responsive:true, maintainAspectRatio:false, scales:{y:{beginAtZero:true, position:'left'}, y1:{beginAtZero:true, position:'right', grid:{display:false}}}}});
}

// Overview
bar('c_dept', D.dept.map(d=>d.Department), D.dept.map(d=>d.attrition), 'Attrition %', colors.c);
doughnut('c_risk', D.risk.map(r=>r.Risk_Segment+' ('+r.count+')'), D.risk.map(r=>r.attrition));
bar('c_tenure', D.tenure.map(t=>t.Tenure_Group), D.tenure.map(t=>t.attrition), 'Attrition %', colors.d);
bar('c_ot', D.overtime.map(o=>o.Overtime), D.overtime.map(o=>o.attrition), 'Attrition %', colors.b);

// Drivers
bar('c_sat', D.satisfaction.map(s=>s.Satisfaction_Category), D.satisfaction.map(s=>s.attrition), 'Attrition %', colors.c);
bar('c_eng', D.engagement.map(e=>e.Engagement_Bucket), D.engagement.map(e=>e.attrition), 'Attrition %', colors.a);
bar('c_stress', D.stress.map(s=>'Level '+s.Stress_Level), D.stress.map(s=>s.attrition), 'Attrition %', colors.d);
bar('c_mgr', D.manager_rel.map(m=>'Rel '+m.Relationship_With_Manager), D.manager_rel.map(m=>m.attrition), 'Attrition %', colors.e);
bar('c_age', D.age.map(a=>a.Age_Group), D.age.map(a=>a.attrition), 'Attrition %', colors.f);

// Compensation
bar('c_salband', D.salary_band.map(s=>s.Salary_Band), D.salary_band.map(s=>s.attrition), 'Attrition %', colors.a);
line2('c_joblevel', D.job_level.map(j=>j.Job_Level), D.job_level.map(j=>j.attrition), 'Attrition %', D.job_level.map(j=>Math.round(j.avg_sal/1000)), 'Avg Salary (K)');
doughnut('c_gender', D.gender.map(g=>g.Gender), D.gender.map(g=>g.attrition));
bar('c_wm', D.work_mode.map(w=>w.Work_Mode), D.work_mode.map(w=>w.attrition), 'Attrition %', colors.b);

let tblDept = '<tr><th>Department</th><th>Headcount</th><th>Attrition %</th><th>Avg Salary</th></tr>' +
  D.dept.map(d=>`<tr><td>${d.Department}</td><td>${d.headcount}</td><td>${d.attrition}%</td><td>${fmtINR(d.avg_sal)}</td></tr>`).join('');
document.getElementById('tbl_dept').innerHTML = tblDept;

// Performance & Growth
bar('c_perf', D.performance.map(p=>p.Performance_Category), D.performance.map(p=>p.attrition), 'Attrition %', colors.c);
bar('c_promo', D.promotion.map(p=>p.Promotion_Last_5Yrs), D.promotion.map(p=>p.attrition), 'Attrition %', colors.e);
bar('c_promogap', D.promo_gap.map(p=>p.Promo_Gap_Bucket), D.promo_gap.map(p=>p.attrition), 'Attrition %', colors.d);
bar('c_train', D.training.map(t=>t.Training_Bucket+' hrs'), D.training.map(t=>t.attrition), 'Attrition %', colors.a);

let tblRole = '<tr><th>Job Role</th><th>Headcount</th><th>Attrition %</th></tr>' +
  D.job_role.map(r=>`<tr><td>${r.Job_Role}</td><td>${r.count}</td><td>${r.attrition}%</td></tr>`).join('');
document.getElementById('tbl_role').innerHTML = tblRole;

// Exit analysis
doughnut('c_exitreason', D.exit_reasons.map(e=>e.reason), D.exit_reasons.map(e=>e.count));
doughnut('c_exittype', D.exit_type.map(e=>e.type), D.exit_type.map(e=>e.count));
let tblLoc = '<tr><th>Location</th><th>Headcount</th><th>Attrition %</th></tr>' +
  D.location.map(l=>`<tr><td>${l.Location}</td><td>${l.count}</td><td>${l.attrition}%</td></tr>`).join('');
document.getElementById('tbl_loc').innerHTML = tblLoc;
</script>
